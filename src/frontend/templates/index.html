<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Chat</title>
<style>
  :root {
    --bg: #212121;
    --sidebar: #171717;
    --panel: #2f2f2f;
    --hover: #2a2a2a;
    --text: #ececec;
    --muted: #9b9b9b;
    --accent: #10a37f;
    --border: #3a3a3a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Roboto;
    display: flex;
  }

  #sidebar {
    width: 260px;
    background: var(--sidebar);
    display: flex;
    flex-direction: column;
    padding: 10px;
    flex-shrink: 0;
  }

  #new-chat {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    text-align: left;
    cursor: pointer;
    font-size: 14px;
    margin-bottom: 12px;
  }
  #new-chat:hover { background: var(--hover); }

  #sessions { flex: 1; overflow-y: auto; }
  .session {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  .session:hover { background: var(--hover); }
  .session.active { background: var(--panel); }
  .session .title {
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .session .del {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    padding: 0 4px;
  }
  .session:hover .del { opacity: 1; }
  .session .del:hover { color: #ff6b6b; }

  /* ---------- main ---------- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar { display: none; padding: 10px; }
  #menu {
    background: none; border: none; color: var(--text);
    font-size: 22px; cursor: pointer;
  }
  #messages { 
    flex: 1; 
    overflow-y: auto; 
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
  }
  .inner {
    max-width: 760px;
    margin: 0 auto;
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  #empty {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 22px; text-align: center;
  }
  .msg { display: flex; flex-direction: column; margin-bottom: 22px; flex-shrink: 0;}
  .msg.user { align-items: flex-end; }
  .bubble { white-space: pre-wrap; word-wrap: break-word; line-height: 1.6; max-width: 100%; }
  .msg.user .bubble {
    background: var(--panel);
    padding: 10px 16px;
    border-radius: 18px;
    max-width: 85%;
  }
  .sources { margin-top: 8px; font-size: 12px; color: var(--muted); }

  #composer-wrap { padding: 0 16px 20px; }
  #composer {
    max-width: 760px; margin: 0 auto;
    background: var(--panel);
    border-radius: 24px;
    display: flex; align-items: flex-end;
    padding: 8px 8px 8px 18px;
    gap: 8px;
  }
  #input {
    flex: 1;
    background: transparent;
    border: none; outline: none; resize: none;
    color: var(--text);
    font: inherit; font-size: 15px;
    line-height: 1.5;
    max-height: 200px;
    padding: 8px 0;
  }
  #send {
    background: var(--text); color: var(--bg);
    border: none; border-radius: 50%;
    width: 36px; height: 36px;
    font-size: 18px; cursor: pointer; flex-shrink: 0;
  }
  #send:disabled { opacity: 0.35; cursor: not-allowed; }

  .cursor::after { content: "▍"; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  @media (max-width: 700px) {
    #sidebar {
      position: fixed; inset: 0 auto 0 0; z-index: 10;
      transform: translateX(-100%); transition: transform 0.2s;
    }
    #sidebar.open { transform: translateX(0); }
    #topbar { display: block; }
  }
</style>
</head>
<body>

<aside id="sidebar">
  <button id="new-chat">+ New chat</button>
  <div id="sessions"></div>
</aside>

<div id="main">
  <div id="topbar"><button id="menu" aria-label="Toggle sidebar">☰</button></div>

  <div id="messages"><div class="inner" id="thread"></div></div>

  <div id="composer-wrap">
    <div id="composer">
      <textarea id="input" rows="1" placeholder="Ask PKMD RAG"></textarea>
      <button id="send" aria-label="Send">↑</button>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
